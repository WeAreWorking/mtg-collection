services:
  mtg-collection:
    # Built by GitHub Actions and pushed to GHCR on every push to main.
    # Dockge / NAS just pulls the image - no local build, no git clone needed.
    image: ghcr.io/weareworking/mtg-collection:latest
    pull_policy: always
    container_name: mtg-collection
    ports:
      - "7432:7432"
    volumes:
      # TrueNAS / Dockge: set MTG_DATA_PATH in .env to your dataset path,
      # e.g. /mnt/SSDs/Databases/MTG-collection (mounted to /app/data).
      # Locally defaults to ./data. The .env file is gitignored, so
      # it will never be overwritten or committed.
      - ${MTG_DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    environment:
      # Set a long random value in .env - never commit the real value.
      - SECRET_KEY=${SECRET_KEY:-change-me-to-something-random}
