<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MTG Collection App{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="retro-space">

  <nav class="navbar">
    <div class="nav-brand">
      <img src="{{ url_for('static', filename='logo.png') }}" class="nav-logo-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('nav-fallback-icon').style.display='inline-block';" />
      <span class="nav-logo" id="nav-fallback-icon" style="display:none;">🌌</span>
      <span class="nav-title">MTG <span class="nav-title-glow">SORTING</span></span>
    </div>
    <div class="nav-links">
      <a href="/collection" class="nav-link {% if request.path == '/collection' %}active{% endif %}">
        <svg class="icon" style="color:#05d9e8" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#icon-collection"/></svg> Collection
      </a>
      <a href="/decks" class="nav-link {% if request.path == '/decks' %}active{% endif %}">
        <svg class="icon" style="color:#ff2a85" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#icon-decks"/></svg> Decks
      </a>
      <a href="/sorting" class="nav-link {% if request.path in ['/sorting', '/build'] %}active{% endif %}">
        <svg class="icon" style="color:#9d4edd" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#icon-sorting"/></svg> SORTING Builder
      </a>
      <a href="/import" class="nav-link {% if request.path == '/import' %}active{% endif %}">
        <svg class="icon" style="color:#ffe600" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#icon-import"/></svg> Import
      </a>
    </div>
    <div class="nav-stats" id="nav-stats">
      <span class="stat-pill stat-cyan" id="stat-cards">— cards</span>
      <span class="stat-pill stat-pink" id="stat-decks">— decks</span>
      <span class="stat-pill stat-gold" id="stat-value" title="Market Value: USD & CAD">— value</span>
      <button id="btn-refresh-prices" class="stat-btn" title="Refresh market prices from Scryfall">↻</button>
    </div>
  </nav>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Card detail modal (shared across pages) -->
  <div id="card-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
      <div class="modal-inner" id="modal-inner">
        <div class="modal-loading">Scanning databanks…</div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
